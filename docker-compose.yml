services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/argus
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data      # Persist SQLite outside container if fallback is used
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery:
    build: .
    command: python -m celery -A src.api.celery_app worker --loglevel=info
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/argus
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      - db
      - redis

  ui:
    build: .
    command: >
      python -m streamlit run src/ui/streamlit_app.py
      --server.port 8501
      --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - API_BASE=http://api:8000   # Use Docker service name, not localhost
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: